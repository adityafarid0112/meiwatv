<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Test Player with No Referer</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif; text-align:center; padding:20px;">
  <h2>Testing HLS Stream (channel13 - Inter Miami vs Cruz Azul)</h2>
  <div style="max-width:800px; margin:0 auto;">
    <video id="video" controls autoplay muted style="width:100%; max-height:450px; background:#111;"></video>
  </div>
  <p id="status">Loading...</p>

  <script>
    const streamUrl = 'https://live2.zundrixmediapipeline.com/live/channel13.m3u8';
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        status.innerText = '✅ Manifest Parsed! Stream Playing...';
        video.play();
      });
      hls.on(Hls.Events.ERROR, function(event, data) {
        status.innerText = '⚠️ HLS Error: ' + data.type + ' / ' + data.details;
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.play();
    }
  </script>
</body>
</html>
